steps:
  - name: Checkout code
    uses: actions/checkout@v6

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Verify Gradle Wrapper
    run: |
      set -e

      test -f ./gradlew
      test -f ./gradle/wrapper/gradle-wrapper.properties

      if [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
        mkdir -p /tmp/gradle

        curl -fL \
          https://services.gradle.org/distributions/gradle-8.9-bin.zip \
          -o /tmp/gradle/gradle-8.9-bin.zip

        unzip -q /tmp/gradle/gradle-8.9-bin.zip \
          -d /tmp/gradle

        mkdir -p /tmp/wrapper-project

        printf 'rootProject.name = "wrapper-project"\n' \
          > /tmp/wrapper-project/settings.gradle.kts

        cd /tmp/wrapper-project

        /tmp/gradle/gradle-8.9/bin/gradle wrapper \
          --gradle-version 8.9 \
          --distribution-type bin

        mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"

        cp \
          /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.jar \
          "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"
      fi

      test -f ./gradle/wrapper/gradle-wrapper.jar
      chmod +x ./gradlew

  - name: Set up Android SDK
    run: |
      set -e

      echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Validate build on pull requests
    if: github.event_name == 'pull_request'
    run: ./gradlew assembleDebug

  - name: Prepare release signing key
    if: github.event_name == 'push'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    run: |
      set -e

      if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
        echo "::error::Missing KEYSTORE_BASE64 or KEYSTORE_PASSWORD repository secret."
        exit 1
      fi

      KEYSTORE_PATH="$RUNNER_TEMP/keyboardx-release.jks"

      printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

      test -s "$KEYSTORE_PATH"

      keytool -list \
        -storetype JKS \
        -keystore "$KEYSTORE_PATH" \
        -storepass "$KEYSTORE_PASSWORD" \
        -alias keyboardx-release

      echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      echo "KEYSTORE_ALIAS=keyboardx-release" >> "$GITHUB_ENV"

  - name: Build signed release APK
    if: github.event_name == 'push'
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/keyboardx-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: keyboardx-release
    run: |
      set -e

      ./gradlew assembleRelease

      test -s app/build/outputs/apk/release/app-release.apk

  - name: Verify release APK signature
    if: github.event_name == 'push'
    run: |
      set -e

      "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
        --verbose \
        app/build/outputs/apk/release/app-release.apk

  - name: Upload release APK
    if: github.event_name == 'push'
    uses: actions/upload-artifact@v6
    with:
      name: keyboardx-release-apk
      path: app/build/outputs/apk/release/app-release.apk
      retention-days: 30
