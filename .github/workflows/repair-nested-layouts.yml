name: Repair Nested Layout Paths

on:
  workflow_dispatch:
  push:
    paths:
      - "app/src/main/res/layout/app/src/main/res/layout/**"
      - ".github/workflows/repair-nested-layouts.yml"

permissions:
  contents: write

jobs:
  repair-paths:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair nested layout files safely
        shell: bash
        run: |
          set -euo pipefail

          nested="app/src/main/res/layout/app/src/main/res/layout"
          correct="app/src/main/res/layout"
          changed=0

          if [[ ! -d "$nested" ]]; then
            echo "No nested layout directory found."
            exit 0
          fi

          while IFS= read -r -d '' source; do
            relative="${source#"$nested"/}"
            target="$correct/$relative"

            mkdir -p "$(dirname "$target")"

            if [[ -e "$target" ]]; then
              if cmp -s -- "$source" "$target"; then
                rm -- "$source"
                echo "Verified identical copy; removed nested file: $source"
                changed=1
              else
                echo "::warning::Files differ; preserving both: $source and $target"
              fi
            else
              cp -- "$source" "$target"

              if cmp -s -- "$source" "$target"; then
                rm -- "$source"
                echo "Verified recovery and removed nested copy: $source"
                changed=1
              else
                echo "::error::Verification failed for $source"
                exit 1
              fi
            fi
          done < <(find "$nested" -type f -print0)

          if [[ "$changed" -eq 0 ]]; then
            echo "No safe repairs were needed."
            exit 0
          fi

          find "$nested" -depth -type d -empty -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- "$correct" "$nested"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Repair nested layout paths safely"
          git push
