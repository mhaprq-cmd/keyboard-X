name: Prepare Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        run: |
          set -e
          mkdir -p /tmp/gradle
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle/gradle-8.9-bin.zip
          unzip -q /tmp/gradle/gradle-8.9-bin.zip \
            -d /tmp/gradle

      - name: Create temporary Gradle project
        run: |
          set -e
          mkdir -p /tmp/wrapper-project
          printf 'rootProject.name = "wrapper-project"\n' > /tmp/wrapper-project/settings.gradle.kts

      - name: Generate Gradle Wrapper
        run: |
          set -e
          cd /tmp/wrapper-project
          /tmp/gradle/gradle-8.9/bin/gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

      - name: Copy Gradle Wrapper JAR
        run: |
          set -e
          test -f /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.jar
          mkdir -p gradle/wrapper
          cp \
            /tmp/wrapper-project/gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Commit Wrapper JAR
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Gradle 8.9 wrapper JAR"
          git push origin HEAD:main
